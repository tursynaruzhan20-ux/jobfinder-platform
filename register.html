<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу — JobFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>JobFinder</h2>
        <nav><a href="index.html">Басты бет</a></nav>
    </header>

    <section class="form-box">
        <h1>Тіркелу</h1>
        <form>
            <label>Аты-жөнің</label>
            <input type="text" placeholder="Атыңды енгіз" required>

            <label>Email</label>
            <input type="email" placeholder="Email енгіз" required>

            <label>Құпиясөз</label>
            <input type="password" placeholder="Құпиясөз ойлап тап" required>

            <button type="submit">Тіркелу</button>
        </form>
        <p>Аккаунтың бар ма? <a href="login.html">Кіру</a></p>
    </section>
    <script src="script.js"></script>
</body>
</html>
